name: database
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADA_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Authorization, integrity, public exposure and scenario suites
        run: ./scripts/test-db.sh
      - name: Migration rehearsal (backup -> restore -> identical security posture)
        run: ./scripts/rehearse-migration.sh
      - name: Generated docs are up to date
        run: |
          ./scripts/gen-docs.sh
          git diff --exit-code docs/architecture
