name: Deploy ADA Core to Supabase

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to apply pending migrations to ADA production Supabase'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ada-core-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADA_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Full database regression suite
        run: ./scripts/test-db.sh
      - name: Migration rehearsal
        run: ./scripts/rehearse-migration.sh
      - name: Generated documentation check
        run: |
          ./scripts/gen-docs.sh
          git diff --exit-code docs/architecture

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ADA_SUPABASE_PROJECT_REF: uyhwcbjfvfkqsixthxkn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployment secret exists
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi
      - name: Show pending migrations
        run: node scripts/supabase-apply.mjs "$ADA_SUPABASE_PROJECT_REF" --dry-run
      - name: Apply pending migrations
        run: node scripts/supabase-apply.mjs "$ADA_SUPABASE_PROJECT_REF"
